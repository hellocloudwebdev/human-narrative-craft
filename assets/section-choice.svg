<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 190" role="img" aria-labelledby="title desc">
  <title id="title">Choose your narrative architecture</title>
  <desc id="desc">A minimalist section divider for choosing between Fair and Rosa.</desc>
  <rect width="1600" height="190" fill="#0b0d12"/>
  <line x1="80" y1="95" x2="1520" y2="95" stroke="#303846"/>
  <rect x="760" y="70" width="80" height="50" rx="25" fill="#11161d" stroke="#9ca3af"/>
  <text x="80" y="60" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="3">SELECTION</text>
  <text x="1320" y="60" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="3">02 — MODE</text>
  <text x="80" y="142" fill="#f9fafb" font-family="Georgia, serif" font-size="34" font-weight="700">Choose the narrative engine.</text>
</svg>