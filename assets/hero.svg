<svg viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1200" height="380" fill="#f6f1e7"/>

  <!-- faint paper rule lines -->
  <g stroke="#e2d9c6" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <text x="600" y="40" text-anchor="middle" font-size="14" letter-spacing="4" fill="#8a7a5c">
    A COMPARATIVE LITERARY ANALYSIS
  </text>

  <text x="600" y="150" text-anchor="middle" font-size="52" fill="#241f18" font-weight="bold">
    <tspan>Fair</tspan>
    <tspan fill="#a89468" font-weight="normal" font-style="italic"> vs. </tspan>
    <tspan>Rosa</tspan>
  </text>

  <text x="600" y="185" text-anchor="middle" font-size="15" fill="#8a7a5c">
    The Lien  ·  The Nine-Minute Clock
  </text>

  <text x="600" y="220" text-anchor="middle" font-size="18" fill="#4d4536" font-style="italic">
    Two short stories, one craft question: what makes restraint read as real?
  </text>

  <!-- Left score card -->
  <g>
    <rect x="140" y="245" width="420" height="90" rx="4" fill="none" stroke="#241f18" stroke-width="1.5"/>
    <text x="160" y="278" font-size="20" fill="#241f18">Fair</text>
    <text x="540" y="278" text-anchor="end" font-size="28" fill="#241f18" font-weight="bold">9.3</text>
    <text x="160" y="305" font-size="12" letter-spacing="1" fill="#8a7a5c">STRONGEST: CHARACTERIZATION</text>
  </g>

  <!-- Right score card -->
  <g>
    <rect x="640" y="245" width="420" height="90" rx="4" fill="none" stroke="#241f18" stroke-width="1.5"/>
    <text x="660" y="278" font-size="20" fill="#241f18">Rosa</text>
    <text x="1040" y="278" text-anchor="end" font-size="28" fill="#241f18" font-weight="bold">9.4</text>
    <text x="660" y="305" font-size="12" letter-spacing="1" fill="#8a7a5c">STRONGEST: STRUCTURE &amp; IMAGE</text>
  </g>

  <text x="600" y="360" text-anchor="middle" font-size="12" letter-spacing="2" fill="#a89468">
    FAIR-SKILL  ·  ROSA-SKILL  ·  HUMAN-NARRATIVE-CRAFT
  </text>
</svg>